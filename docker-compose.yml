services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: degreebaba_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d degreebaba_ai"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      PYTHONPATH: /app/backend:/app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "2323:2323"
    volumes:
      - ./backend:/app/backend
      - ./ingestion:/app/ingestion

volumes:
  pgdata:
